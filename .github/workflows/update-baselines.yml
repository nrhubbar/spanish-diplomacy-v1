name: Update visual baselines

# Visual baselines are Linux Chromium renders from the container CI checks them in (scripts/linux).
# `npm run e2e:baselines` renders them on a laptop with Docker. Without Docker:
# push a branch named baselines/<anything> (or run this workflow by hand), download the
# "visual-baselines" artifact, review the images, and commit them to e2e/baselines/ in a commit
# of their own (project/coding-principles.md).
on:
  push:
    branches: ["baselines/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  baselines:
    name: Render baselines
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: jdx/mise-action@v5
        with:
          install_args: node git-lfs
      - run: npm run e2e:baselines
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/baselines
          retention-days: 14
          if-no-files-found: error
