<title>Milestone 3 Ideation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a design-review dossier. Sticky index on the left (top bar on phones), one reading column, widgets and questions as set-off "cards on the table". */
:root {
  --bg: #e6dfcd;          /* table canvas, from the app's --canvas */
  --paper: #fbf6ea;       /* reading sheet, the app's --paper */
  --surface: #f4eddc;     /* widget card */
  --surface-2: #ebe2cc;   /* inset rows, table heads */
  --ink: #241d18;
  --ink-soft: #5b4d40;
  --line: #c9bba0;
  --accent: #7d2f2a;      /* oxblood, the app's --accent */
  --accent-ink: #fbf6ea;
  --gold: #b8891a;
  --route: #1f3550;
  --good: #2f7d4f;
  --bad: #9e2b2b;
  --warn: #b5730f;
  --rep: #b1493f;
  --nic: #a3841f;
  --sic: #665089;
  --c1: #7a1f1a; --c2: #b5483c; --c3: #d99a6c; --c4: #cbbf9f; --c5: #7d9bb5; --c6: #3f6a90; --c7: #1f3550;
  --serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --shadow: 0 1px 0 rgb(36 29 24 / 8%), 0 6px 18px rgb(36 29 24 / 8%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120e; --paper: #221a14; --surface: #2b221a; --surface-2: #352a20;
    --ink: #efe5d2; --ink-soft: #c2b29b; --line: #4d3f31; --accent: #d9897e; --accent-ink: #1b1410;
    --gold: #e0b54a; --route: #9cb7d6; --good: #6fc08f; --bad: #e07a72; --warn: #e5a54a;
    --rep: #d9786d; --nic: #d9b84a; --sic: #a88fd1;
    --c1: #e07a72; --c2: #c9665b; --c3: #b98a63; --c4: #6f6555; --c5: #5f86a8; --c6: #7fa6cc; --c7: #b5cfe8;
    --shadow: 0 1px 0 rgb(0 0 0 / 30%), 0 6px 18px rgb(0 0 0 / 30%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17120e; --paper: #221a14; --surface: #2b221a; --surface-2: #352a20;
  --ink: #efe5d2; --ink-soft: #c2b29b; --line: #4d3f31; --accent: #d9897e; --accent-ink: #1b1410;
  --gold: #e0b54a; --route: #9cb7d6; --good: #6fc08f; --bad: #e07a72; --warn: #e5a54a;
  --rep: #d9786d; --nic: #d9b84a; --sic: #a88fd1;
  --c1: #e07a72; --c2: #c9665b; --c3: #b98a63; --c4: #6f6555; --c5: #5f86a8; --c6: #7fa6cc; --c7: #b5cfe8;
  --shadow: 0 1px 0 rgb(0 0 0 / 30%), 0 6px 18px rgb(0 0 0 / 30%);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--route); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.2; text-wrap: balance; margin: 0; }
code, kbd { font-family: var(--mono); font-size: 0.86em; background: var(--surface-2); padding: 0.05em 0.3em; border-radius: 3px; }

.shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 14px 14px 16px; font-size: 0.86rem; }
.toc h2 { font-size: 1rem; margin-bottom: 6px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.toc li.group { margin-top: 10px; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 3px 6px; border-radius: 4px; text-decoration: none; color: var(--ink); }
.toc a:hover { background: var(--surface-2); }
.toc a.active { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
.toc .count { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.answerbox { display: grid; gap: 8px; padding-bottom: 12px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.progress-text { font-family: var(--mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.progress-track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
.btn { font: 600 0.86rem var(--sans); border: 1px solid var(--ink); background: var(--accent); color: var(--accent-ink); border-radius: 5px; padding: 8px 12px; cursor: pointer; min-height: 38px; }
.btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
.copy-status { font-size: 0.78rem; color: var(--good); min-height: 1.1em; }
.copy-fallback { width: 100%; min-height: 140px; font: 0.75rem/1.4 var(--mono); }
.mobile-bar { display: none; }

main { min-width: 0; display: grid; gap: 22px; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 28px clamp(16px, 4vw, 44px) 32px; box-shadow: var(--shadow); min-width: 0; }
.sheet > * + * { margin-top: 0.9rem; }
.masthead .eyebrow, .eyebrow { font: 600 0.72rem var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.masthead h1 { font-size: clamp(1.9rem, 4.5vw, 2.7rem); }
.masthead .meta { font-family: var(--mono); font-size: 0.8rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.group-head { padding: 6px 4px 0; }
.group-head h2 { font-size: 1.05rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-family: var(--sans); font-weight: 600; }
.group-head p { color: var(--ink-soft); font-size: 0.92rem; max-width: 70ch; }
.sheet h2 { font-size: clamp(1.4rem, 3vw, 1.8rem); }
.sheet h2 .idea-no { font-family: var(--mono); font-size: 0.8em; color: var(--accent); margin-right: 0.4em; }
.sheet h3 { font-size: 1.12rem; margin-top: 1.6rem; padding-top: 0.9rem; border-top: 1px solid var(--line); }
.sheet h4 { font-size: 1rem; margin-top: 1.2rem; }
.sheet p, .sheet li { max-width: 72ch; }
.sheet ul, .sheet ol { padding-left: 1.25rem; }
.sheet li + li { margin-top: 0.25rem; }
.sheet blockquote { margin: 0; padding: 8px 14px; border-left: 3px solid var(--gold); background: var(--surface); font-family: var(--serif); font-style: italic; }
.summary-line { font-family: var(--serif); font-size: 1.12rem; }
.table-wrap, .w-scroll { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
.sheet table, .w-table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
.sheet th, .sheet td, .w-table th, .w-table td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.sheet th, .w-table th { background: var(--surface-2); font-weight: 600; }
.sheet td:first-child { min-width: 9rem; }
.recommend { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--good); padding: 10px 14px; border-radius: 4px; }

figure.mockup { margin: 1rem 0 0; }
figure.mockup img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); }
figure.mockup figcaption { font-size: 0.8rem; color: var(--ink-soft); margin-top: 6px; }
.missing { font-size: 0.85rem; color: var(--ink-soft); background: var(--surface-2); padding: 10px 12px; border-radius: 4px; border: 1px dashed var(--line); }

/* Widgets */
.widget { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; font-size: 0.9rem; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.widget > *, .w-row > *, .w-grid > * { min-width: 0; max-width: 100%; }
.widget svg, .widget canvas { max-width: 100%; height: auto; }
.widget h4, .widget h5 { margin: 0; font-family: var(--serif); }
.w-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.w-label { font-weight: 600; font-size: 0.82rem; color: var(--ink-soft); }
.w-out { font-family: var(--mono); font-weight: 500; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.w-note { font-size: 0.78rem; color: var(--ink-soft); }
.w-bar-track { background: var(--surface-2); border-radius: 3px; height: 14px; overflow: hidden; min-width: 60px; flex: 1; }
.w-bar { height: 100%; background: var(--accent); min-width: 1px; }
.w-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.w-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-width: 0; }
.widget select, .widget input[type=number], .widget input[type=text] { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-height: 34px; max-width: 100%; }
.widget input[type=range] { accent-color: var(--accent); max-width: 100%; }
.widget button { font: 500 0.84rem var(--sans); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; min-height: 34px; }
.widget button[aria-pressed="true"], .widget button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.widget label { display: inline-flex; align-items: center; gap: 6px; }
.widget-error { color: var(--bad); font-size: 0.85rem; }

/* Questions */
.questions { display: grid; gap: 12px; }
.q { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 12px 14px 14px; margin: 0; min-width: 0; }
.q.answered { border-left: 4px solid var(--good); }
.q legend { display: contents; }
.q .q-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-bottom: 8px; }
.q .q-id { font-family: var(--mono); font-size: 0.74rem; background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; color: var(--ink-soft); }
.q .q-text { font-weight: 600; flex: 1 1 260px; }
.q .q-multi { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--route); border: 1px solid currentColor; border-radius: 3px; padding: 0 5px; }
.q .opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.q .opt:hover { background: var(--surface-2); }
.q .opt input { margin-top: 4px; accent-color: var(--accent); width: 17px; height: 17px; }
.q .opt .rec { color: var(--good); font-weight: 600; font-size: 0.82rem; margin-left: 4px; }
.q .opt .why { grid-column: 2; font-size: 0.8rem; color: var(--ink-soft); }
.q textarea { width: 100%; margin-top: 8px; min-height: 2.4rem; font: 0.86rem var(--sans); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; resize: vertical; }
.q .notes-label { font-size: 0.76rem; color: var(--ink-soft); display: block; margin-top: 6px; }

.sources ol { font-size: 0.82rem; overflow-wrap: anywhere; }
.diagram { overflow-x: auto; }
.diagram svg { display: block; min-width: 640px; width: 100%; height: auto; }
.diagram svg text { fill: var(--ink); font-family: var(--sans); font-size: 12px; }
.diagram .node { fill: var(--paper); stroke: var(--good); stroke-width: 1.2; }
.diagram .node.later { fill: var(--surface-2); stroke: var(--ink-soft); stroke-dasharray: 4 3; }
.diagram .edge { fill: none; stroke: var(--ink-soft); stroke-width: 1.4; }
.diagram .arrowhead { fill: var(--ink-soft); }
.diagram .band { fill: var(--surface-2); stroke: var(--line); }
.diagram svg text.col { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; fill: var(--ink-soft); }
.pill { display: inline-block; font: 600 0.72rem var(--sans); letter-spacing: 0.04em; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.pill.m3 { background: var(--good); color: var(--paper); border-color: var(--good); }
.pill.later { background: var(--surface-2); }
.pill.drop { color: var(--bad); border-color: var(--bad); }

@media (max-width: 900px) {
  html { scroll-padding-top: 64px; }
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 0 48px; }
  .toc { position: static; max-height: none; display: none; }
  .toc.open { display: block; position: fixed; inset: calc(env(safe-area-inset-top, 0px) + 56px) 0 0; z-index: 20; border-radius: 0; overflow: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mobile-bar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--paper); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .mobile-bar .progress-text { font-size: 0.75rem; }
  .sheet { padding: 20px 16px 24px; }
}
</style>

<div class="shell">
  <div class="mobile-bar">
    <button class="btn secondary" id="toc-toggle" type="button" aria-expanded="false" aria-controls="toc">Contents</button>
    <span class="progress-text" data-progress-text>0 of 0 answered</span>
    <button class="btn" type="button" data-copy>Copy my answers</button>
  </div>
  <nav class="toc" id="toc" aria-label="Contents">
    <div class="answerbox">
      <h2>Your answers</h2>
      <span class="progress-text" data-progress-text>0 of 0 answered</span>
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="btn-row">
        <button class="btn" type="button" data-copy>Copy my answers</button>
        <button class="btn secondary" type="button" id="fill-rec">Use recommended for blanks</button>
      </div>
      <div class="btn-row">
        <button class="btn secondary" type="button" id="clear-all">Clear all</button>
        <button class="btn secondary" type="button" id="clear-confirm" hidden>Yes, clear every answer</button>
      </div>
      <div class="copy-status" id="copy-status" role="status" aria-live="polite"></div>
      <div class="w-note" id="remote-status">Answers save in this browser. Use Copy my answers to send them to the team.</div>
      <textarea class="copy-fallback" id="copy-fallback" hidden readonly aria-label="Your answers as Markdown"></textarea>
    </div>
    <h2>Contents</h2>
    {{TOC}}
  </nav>
  <main id="main">
    {{CONTENT}}
  </main>
</div>

<script id="questions-data" type="application/json">{{QUESTIONS_JSON}}</script>
<script>
{{WIDGETS_JS}}
</script>
<script>
(function () {
  "use strict";
  var KEY = "m3-ideation-answers-v1";
  var questions = [];
  try { questions = JSON.parse(document.getElementById("questions-data").textContent); } catch (e) { questions = []; }
  var byId = {};
  questions.forEach(function (q) { byId[q.id] = q; });
  var answers = {};
  try { var raw = window.localStorage.getItem(KEY); if (raw) answers = JSON.parse(raw) || {}; } catch (e) { answers = {}; }
  var remote = null, remoteTimer = null;
  function remoteStatus(text) { var s = document.getElementById("remote-status"); if (s) s.textContent = text; }
  function pushRemote() {
    if (!remote) return;
    clearTimeout(remoteTimer);
    remoteTimer = setTimeout(function () {
      var n = 0; questions.forEach(function (q) { if (isAnswered(q.id)) n += 1; });
      remote.set({ answers: answers, answered: n, total: questions.length, updatedAt: new Date().toISOString() }).then(
        function () { remoteStatus("Saved to this artifact for the team."); },
        function (e) { if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { remote = null; remoteStatus("Saved in this browser only. Use Copy my answers to send them."); } });
    }, 1200);
  }
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) { /* storage unavailable: answers live in the page only */ } pushRemote(); }
  function isAnswered(id) { var a = answers[id]; return !!(a && a.choices && a.choices.length); }

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function renderQuestion(q) {
    var fs = el("fieldset", "q"); fs.id = q.id; fs.setAttribute("data-qid", q.id);
    var lg = el("legend"); var head = el("div", "q-head");
    head.appendChild(el("span", "q-id", q.id));
    head.appendChild(el("span", "q-text", q.text));
    if (q.multi) head.appendChild(el("span", "q-multi", "Choose all that apply"));
    lg.appendChild(head); fs.appendChild(lg);
    var type = q.multi ? "checkbox" : "radio";
    (q.options || []).forEach(function (o, i) {
      var lab = el("label", "opt");
      var inp = document.createElement("input"); inp.type = type; inp.name = q.id; inp.value = String(i); inp.id = q.id + "-o" + i;
      var txt = el("span"); txt.appendChild(document.createTextNode(o.label));
      if (o.recommended) txt.appendChild(el("span", "rec", "(Recommended)"));
      lab.appendChild(inp); lab.appendChild(txt);
      if (o.rationale) lab.appendChild(el("span", "why", o.rationale));
      fs.appendChild(lab);
      inp.addEventListener("change", function () { readQuestion(fs, q); });
    });
    var nl = el("label", "notes-label", "Other / notes"); nl.htmlFor = q.id + "-notes";
    var ta = document.createElement("textarea"); ta.id = q.id + "-notes"; ta.rows = 1; ta.placeholder = "Optional: another option, a condition, or a reason";
    ta.addEventListener("input", function () { readQuestion(fs, q); });
    fs.appendChild(nl); fs.appendChild(ta);
    applyAnswer(fs, q);
    return fs;
  }
  function applyAnswer(fs, q) {
    var a = answers[q.id] || {};
    var chosen = (a.choices || []).map(String);
    Array.prototype.forEach.call(fs.querySelectorAll("input"), function (inp) { inp.checked = chosen.indexOf(inp.value) >= 0; });
    var ta = fs.querySelector("textarea"); if (ta) ta.value = a.notes || "";
    fs.classList.toggle("answered", isAnswered(q.id));
  }
  function readQuestion(fs, q) {
    var choices = [];
    Array.prototype.forEach.call(fs.querySelectorAll("input"), function (inp) { if (inp.checked) choices.push(Number(inp.value)); });
    var notes = fs.querySelector("textarea").value;
    if (!choices.length && !notes.trim()) delete answers[q.id]; else answers[q.id] = { choices: choices, notes: notes };
    fs.classList.toggle("answered", isAnswered(q.id));
    save(); updateProgress();
  }

  var groups = {};
  questions.forEach(function (q) { var k = String(q.idea); (groups[k] = groups[k] || []).push(q); });
  Array.prototype.forEach.call(document.querySelectorAll(".questions[data-idea]"), function (box) {
    var list = groups[box.getAttribute("data-idea")] || [];
    if (!list.length) { box.appendChild(el("p", "missing", "No questions were drafted for this item.")); return; }
    list.forEach(function (q) { box.appendChild(renderQuestion(q)); });
  });

  function updateProgress() {
    var n = 0; questions.forEach(function (q) { if (isAnswered(q.id)) n += 1; });
    var label = n + " of " + questions.length + " answered";
    Array.prototype.forEach.call(document.querySelectorAll("[data-progress-text]"), function (s) { s.textContent = label; });
    var fill = document.getElementById("progress-fill"); if (fill) fill.style.width = (questions.length ? (100 * n / questions.length) : 0) + "%";
    Array.prototype.forEach.call(document.querySelectorAll("[data-toc-idea]"), function (c) {
      var list = [];
      c.getAttribute("data-toc-idea").split(",").forEach(function (k) { list = list.concat(groups[k] || []); });
      var m = 0; list.forEach(function (q) { if (isAnswered(q.id)) m += 1; });
      c.textContent = list.length ? (m + "/" + list.length) : "";
    });
  }

  function answersMarkdown() {
    var lines = ["# Milestone 3 ideation answers", ""];
    var n = 0; questions.forEach(function (q) { if (isAnswered(q.id) || (answers[q.id] && answers[q.id].notes)) n += 1; });
    lines.push("Answered " + n + " of " + questions.length + " questions. Copied " + new Date().toISOString().slice(0, 10) + ".", "");
    var currentIdea = null;
    questions.forEach(function (q) {
      var a = answers[q.id]; if (!a) return;
      if (q.idea !== currentIdea) { currentIdea = q.idea; lines.push("## " + (q.groupTitle || ("Idea " + q.idea)), ""); }
      var picked = (a.choices || []).map(function (i) { var o = q.options[i]; return o ? o.label + (o.recommended ? " (Recommended)" : "") : "?"; });
      lines.push("- **" + q.id + "** " + q.text);
      lines.push("  - Answer: " + (picked.length ? picked.join("; ") : "(no option chosen)"));
      if (a.notes && a.notes.trim()) lines.push("  - Notes: " + a.notes.trim().replace(/\s*\n\s*/g, " / "));
    });
    var blanks = questions.filter(function (q) { return !answers[q.id]; }).map(function (q) { return q.id; });
    if (blanks.length) { lines.push("", "## Unanswered", "", blanks.join(", ")); }
    return lines.join("\n") + "\n";
  }
  var status = document.getElementById("copy-status");
  var fallback = document.getElementById("copy-fallback");
  function showFallback(text) {
    fallback.hidden = false; fallback.value = text; fallback.focus(); fallback.select();
    status.textContent = "Copying is blocked here. The answers are selected below: copy them by hand.";
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"), function (b) {
    b.addEventListener("click", function () {
      var text = answersMarkdown();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { status.textContent = "Copied as Markdown. Paste it into the chat or the tasks doc."; fallback.hidden = true; },
            function () { showFallback(text); });
        } else { showFallback(text); }
      } catch (e) { showFallback(text); }
      if (window.matchMedia("(max-width: 900px)").matches) { document.getElementById("toc").classList.add("open"); document.getElementById("toc-toggle").setAttribute("aria-expanded", "true"); }
    });
  });
  document.getElementById("fill-rec").addEventListener("click", function () {
    var filled = 0;
    questions.forEach(function (q) {
      if (isAnswered(q.id)) return;
      var idx = -1; (q.options || []).forEach(function (o, i) { if (o.recommended && idx < 0) idx = i; });
      if (idx < 0) return;
      var prev = answers[q.id] || { notes: "" };
      answers[q.id] = { choices: [idx], notes: prev.notes || "" }; filled += 1;
    });
    save();
    Array.prototype.forEach.call(document.querySelectorAll("fieldset.q"), function (fs) { applyAnswer(fs, byId[fs.getAttribute("data-qid")]); });
    updateProgress(); status.textContent = filled + " blank questions set to the recommended option. Review and change any you disagree with.";
  });
  var clearAll = document.getElementById("clear-all"), clearConfirm = document.getElementById("clear-confirm");
  clearAll.addEventListener("click", function () { clearConfirm.hidden = !clearConfirm.hidden; });
  clearConfirm.addEventListener("click", function () {
    answers = {}; save(); clearConfirm.hidden = true;
    Array.prototype.forEach.call(document.querySelectorAll("fieldset.q"), function (fs) { applyAnswer(fs, byId[fs.getAttribute("data-qid")]); });
    updateProgress(); status.textContent = "All answers cleared.";
  });
  var toggle = document.getElementById("toc-toggle"), toc = document.getElementById("toc");
  toggle.addEventListener("click", function () { var open = toc.classList.toggle("open"); toggle.setAttribute("aria-expanded", open ? "true" : "false"); });
  Array.prototype.forEach.call(toc.querySelectorAll("ol a"), function (a) { a.addEventListener("click", function () { toc.classList.remove("open"); toggle.setAttribute("aria-expanded", "false"); }); });

  // Widgets
  Array.prototype.forEach.call(document.querySelectorAll(".widget[data-widget]"), function (w) {
    var fn = window.M3W && window.M3W[w.getAttribute("data-widget")];
    if (typeof fn !== "function") { w.appendChild(el("p", "widget-error", "This widget is not available.")); return; }
    try { fn(w); } catch (e) { w.appendChild(el("p", "widget-error", "This widget failed to start: " + (e && e.message))); }
  });

  // Active section in the contents
  var links = Array.prototype.slice.call(toc.querySelectorAll("ol a[href^='#']"));
  if ("IntersectionObserver" in window) {
    var map = {}; links.forEach(function (a) { map[a.getAttribute("href").slice(1)] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting && map[en.target.id]) { links.forEach(function (l) { l.classList.remove("active"); }); map[en.target.id].classList.add("active"); } });
    }, { rootMargin: "-10% 0px -80% 0px" });
    Object.keys(map).forEach(function (id) { var t = document.getElementById(id); if (t) io.observe(t); });
  }
  updateProgress();

  // Optional: when this page runs as a claude.ai Artifact with storage, also keep answers there.
  try {
    if (window.claude && typeof window.claude.use === "function") {
      Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
        var db = r[0], user = r[1];
        if (!db || !user) return null;
        return user.id().then(function (uid) {
          if (!uid) return null;
          var ref; try { ref = db.doc("answers/" + uid); } catch (e) { return null; }
          return ref.get().then(function (snap) {
            remote = ref;
            var d = snap.exists ? snap.data() : null;
            if (d && d.answers && !Object.keys(answers).length) {
              answers = d.answers;
              try { window.localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) { /* ignore */ }
              Array.prototype.forEach.call(document.querySelectorAll("fieldset.q"), function (fs) { applyAnswer(fs, byId[fs.getAttribute("data-qid")]); });
              updateProgress();
            }
            remoteStatus("Answers save to this artifact for the team, and to this browser.");
          });
        });
      }).catch(function () { /* no shared storage: browser only */ });
    }
  } catch (e) { /* no runtime */ }
})();
</script>
