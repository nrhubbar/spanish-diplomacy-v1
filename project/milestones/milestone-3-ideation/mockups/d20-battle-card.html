<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1440x800">
<meta name="mock-out" content="1200">
<title>d20-battle-card</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .pane-cover .battle-card-body { gap: 0.5rem; }
  .pane-cover .battle-roll-table th, .pane-cover .battle-roll-table td { padding: 0.12rem 0; }
  .d20 { width: 1.2rem; height: 1.2rem; margin-right: 0.35rem; vertical-align: -0.28rem; }
  .ladder { position: relative; margin-top: 0.15rem; }
  .ladder-bar { display: grid; grid-template-columns: repeat(20, 1fr); height: 22px; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .ladder-bar i { border-left: 1px solid rgb(255 253 247 / 55%); }
  .ladder-bar i:first-child { border-left: 0; }
  .ladder-labels { display: grid; grid-template-columns: 3fr 4fr 3fr 4fr 3fr 3fr; margin-top: 3px; font-size: 0.62rem; line-height: 1.15; color: var(--ink-soft); }
  .ladder-labels span { padding: 0 2px; border-left: 1px solid rgb(36 29 24 / 30%); }
  .ladder-labels span:first-child { border-left: 0; }
  .ladder-labels span[data-hit="true"] { color: var(--ink); font-weight: 800; }
  .ladder-mark { position: absolute; top: -9px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--ink); transform: translateX(-6px); }
  .ladder-mark span { position: absolute; top: -22px; left: -12px; width: 24px; text-align: center; font-size: 0.72rem; font-weight: 800; color: var(--paper); background: var(--ink); border-radius: 3px; }
  .ladder-ticks { display: flex; justify-content: space-between; font-size: 0.58rem; color: var(--ink-soft); margin-top: 1px; }
  .effects { display: grid; gap: 0.15rem; margin: 0; padding: 0; list-style: none; font-size: 0.79rem; }
  .effects li { display: flex; gap: 0.4rem; align-items: baseline; }
  .effects li::before { content: ""; flex: none; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--c, var(--ink)); transform: translateY(-1px); }
</style>
</head>
<body>
<div class="stage" style="width:1440px;height:800px">
  <img class="base" src="base/battle.webp" alt="">
  <div id="pane"></div>
  <div id="mark"></div>
</div>
<script>
const emblem = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -48 96 96" fill="none" stroke="currentColor" width="100%" height="100%">
  <circle r="46.2" stroke-width="1.4"/><circle r="43.6" stroke-width="2.6" stroke-dasharray="0 3.382" stroke-linecap="round"/><circle r="40.6" stroke-width="1.8"/><circle r="29.8" stroke-width="1.8"/><circle r="27.4" stroke-width="1.2"/>
  <path d="M-5.6 -38.4L5.5 -38.4M-16.3 -35.2L16.3 -35.2M-21.9 -32L21.9 -32M-26 -28.8L-13.1 -28.8M13 -28.8L26 -28.8M-29.2 -25.6L-18.6 -25.6M18.5 -25.6L29.1 -25.6M-31.7 -22.4L-22.3 -22.4M22.3 -22.4L31.6 -22.4M-33.7 -19.2L-25.1 -19.2M25.1 -19.2L33.7 -19.2M-35.3 -16L-27.3 -16M27.2 -16L35.3 -16M-36.6 -12.8L-28.9 -12.8M28.9 -12.8L36.6 -12.8M-37.6 -9.6L-30.2 -9.6M30.1 -9.6L37.5 -9.6M-38.3 -6.4L-31 -6.4M30.9 -6.4L38.2 -6.4M-38.7 -3.2L-31.5 -3.2M31.4 -3.2L38.6 -3.2M-38.8 0L-31.6 0M31.6 0L38.8 0M-38.7 3.2L-31.5 3.2M31.4 3.2L38.6 3.2M-38.3 6.4L-31 6.4M30.9 6.4L38.2 6.4M-37.6 9.6L-30.2 9.6M30.1 9.6L37.5 9.6M-36.6 12.8L-28.9 12.8M28.9 12.8L36.6 12.8M-35.3 16L-27.3 16M27.2 16L35.3 16M-33.7 19.2L-25.1 19.2M25.1 19.2L33.7 19.2M-31.7 22.4L-22.3 22.4M22.3 22.4L31.6 22.4M-29.2 25.6L-18.6 25.6M18.5 25.6L29.1 25.6M-26 28.8L-13.1 28.8M13 28.8L26 28.8M-21.9 32L21.9 32M-16.3 35.2L16.3 35.2M-5.6 38.4L5.5 38.4" stroke-width="1.1"/>
  <path d="M 0 -20 L 16 -14 V -1 C 16 9.5 9.5 16.5 0 20 C -9.5 16.5 -16 9.5 -16 -1 V -14 Z" fill="currentColor" fill-opacity="0.14" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 8 0 H -8 M -1 -7 L -8 0 L -1 7" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const d20 = '<svg class="d20" viewBox="0 0 24 24"><path d="M12 1.5 21.5 7v10L12 22.5 2.5 17V7z" fill="#fbf6ea" stroke="#241d18" stroke-width="1.3" stroke-linejoin="round"/><path d="M12 1.5 7 9h10zM7 9l5 8 5-8M2.5 7 7 9l-4.5 8M21.5 7 17 9l4.5 8M12 17v5.5" fill="none" stroke="#241d18" stroke-width="0.8"/></svg>';
// Bands for the 2:1 column: 1-3, 4-7, 8-10, 11-14, 15-17, 18-20.
const bands = [["#7a2a24", 3], ["#b5716a", 4], ["#c9bba0", 3], ["#8a7aa8", 4], ["#665089", 3], ["#3d2f55", 3]];
const cells = bands.flatMap(([color, n]) => Array.from({ length: n }, () => `<i style="background:${color}"></i>`)).join("");
const body = `
<section class="pane-section battle-report" style="padding-top:0">
  <p class="battle-summary" style="margin-top:0">3 battles &middot; 1 province changed hands &middot; 118 men lost</p>
  <div class="battle-card" open style="margin-top:0.45rem">
    <div class="battle-card-summary" style="padding:0.45rem 0.6rem;cursor:default">
      <span class="battle-emblem" style="width:3rem;height:3rem">${emblem}</span>
      <span class="battle-card-heading"><span class="battle-kicker">Battle for Andaluc&iacute;a</span><span class="battle-title">Defender gives ground</span><span class="battle-occupation">The Southern Insurgent Command took C&oacute;rdoba province; Andaluc&iacute;a is now contested.</span></span>
    </div>
    <div class="battle-card-body" style="padding:0 0.6rem 0.6rem">
      <div class="battle-sides">
        <div class="battle-side" style="--faction-color:#665089"><div class="battle-side-head"><span class="battle-side-role">Attacker</span><span class="battle-side-faction">Southern Insurgent Command</span><span class="battle-side-value">13</span></div>
          <ul class="battle-armies"><li><span>Tercio Legion No. 1</span><span class="battle-army-value">6</span></li><li><span>Seville Light Artillery</span><span class="battle-army-value">4</span></li><li><span>Seville Falange column</span><span class="battle-army-value">3</span></li></ul></div>
        <div class="battle-side" style="--faction-color:#b1493f"><div class="battle-side-head"><span class="battle-side-role">Defender</span><span class="battle-side-faction">Republican Government</span><span class="battle-side-value">6</span></div>
          <ul class="battle-armies"><li><span>Vitoria Infantry Regiment No. 8</span><span class="battle-army-value">6</span></li></ul></div>
      </div>
      <div class="battle-roll">
        <p><span class="battle-odds-label">2:1</span> odds, 2:1 column <span class="new-tag">d20</span></p>
        <table class="battle-roll-table"><tbody>
          <tr><th>d20 roll</th><td>${d20}14</td></tr>
          <tr><th>Artillery: 4 attack points, +1 per full 3</th><td>+1</td></tr>
          <tr><th>Defender dug in (3 of 3)</th><td>&minus;3</td></tr>
          <tr class="battle-roll-total"><th>Result row</th><td>= 12</td></tr>
        </tbody></table>
      </div>
      <div class="ladder">
        <div class="ladder-mark" style="left:calc(11.5 / 20 * 100%)"><span>12</span></div>
        <div class="ladder-bar">${cells}</div>
        <div class="ladder-ticks"><span>1</span><span>5</span><span>10</span><span>15</span><span>20</span></div>
        <div class="ladder-labels"><span>Attack repulsed</span><span>Attack checked</span><span>Stale&shy;mate</span><span data-hit="true">Gives ground</span><span>Driven back</span><span>Routed</span></div>
      </div>
      <ul class="effects">
        <li style="--c:#665089">Defender gives ground: loses 1 province.</li>
        <li style="--c:#b1493f">Defender: 12 percent losses (70 men).</li>
        <li style="--c:#c07a14">Defender partly demoralized (&minus;1 attack).</li>
        
      </ul>
    </div>
  </div>
</section>`;
document.getElementById("pane").innerHTML = pane({ title: "Turn report", toggle: "Hide turn report", body, footer: "Start Next Turn" });
document.getElementById("mark").innerHTML = mark("top:28px;right:120px");
</script>
</body>
</html>
