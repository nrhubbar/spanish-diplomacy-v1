<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1440x800">
<meta name="mock-out" content="1200">
<title>planning-resources</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .recruit-menu { display: grid; gap: 0.25rem; padding: 0.3rem; border: 1px solid rgb(36 29 24 / 25%); border-radius: 8px; background: rgb(255 255 255 / 55%); margin-top: 0.4rem; }
  .recruit-row { display: grid; grid-template-columns: auto 1fr auto; column-gap: 0.55rem; align-items: center; padding: 0.3rem 0.55rem; border: 1px solid rgb(36 29 24 / 30%); border-radius: 6px; background: var(--paper); }
  .recruit-row[data-picked="true"] { border-color: #7a5a06; background: var(--gold-wash); box-shadow: 0 0 0 1.5px var(--gold); }
  .recruit-row[data-locked="true"] { opacity: 0.55; border-style: dashed; }
  .recruit-name { font-family: var(--serif); font-size: 0.92rem; font-weight: 700; line-height: 1.15; }
  .recruit-name b { font-family: var(--sans); font-size: 0.82rem; margin-left: 0.25rem; }
  .recruit-cost { grid-column: 2 / 4; color: var(--ink-soft); font-size: 0.72rem; line-height: 1.25; }
  .recruit-turns { font-size: 0.68rem; font-weight: 800; color: var(--ink-soft); white-space: nowrap; text-align: right; }
  .recruit-row .mini-symbol { grid-row: span 2; }
  .menu-head { display: flex; justify-content: space-between; align-items: baseline; }
  .menu-head h4 { margin: 0; font-size: 0.9rem; }
  .aid { margin-top: 0.3rem; color: var(--ink-soft); font-size: 0.72rem; }
  .aid b { color: var(--success); }
  .army-card { margin-top: 0.4rem; padding: 0.45rem 0.6rem; border: 1px solid rgb(36 29 24 / 30%); border-radius: 6px; background: var(--paper); }
  .army-card .formation-name { font-weight: 700; }
  .replenish { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.35rem; padding-top: 0.35rem; border-top: 1px dotted rgb(36 29 24 / 25%); font-size: 0.76rem; }
  .replenish button { min-height: 1.8rem; padding: 0 0.6rem; font-size: 0.76rem; font-weight: 700; color: var(--ink); background: var(--gold-wash); border-color: #7a5a06; }
  .order-tabs { display: flex; gap: 0.3rem; margin-top: 0.5rem; }
  .order-tabs span { flex: 1; text-align: center; padding: 0.25rem 0; border: 1px solid rgb(36 29 24 / 30%); border-radius: 6px; background: var(--paper); font-family: var(--serif); font-weight: 700; font-size: 0.78rem; }
  .order-tabs span[data-on="true"] { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  .ghost { position: absolute; z-index: 5; }
  .ghost .unit-counter { border-style: dashed !important; opacity: 0.88; }
  .ghost-tag { position: absolute; left: 372px; top: 446px; z-index: 6; padding: 1px 6px; border: 1px solid var(--ink); border-radius: 4px; background: var(--paper); font: 700 11px var(--sans); white-space: nowrap; }
</style>
</head>
<body>
<div class="stage" style="width:1440px;height:800px">
  <img class="base" src="base/order-menu.webp" alt="">
  <div class="counter-layer" data-level="overview" id="ghost" style="z-index:5"></div>
  <div class="ghost-tag">Recruiting: militia column, ready Turn 2</div>
  <div id="pane"></div>
  <div id="mark"></div>
</div>
<script>
const R = "#b1493f";
document.getElementById("ghost").innerHTML = counter({ f: "rep", type: "militia", x: 420, y: 404, w: 48, h: 30, ordered: false, style: "border-style:dashed;opacity:.9" });
const row = (type, name, values, cost, turns, picked, locked) => `<div class="recruit-row" data-picked="${picked}" data-locked="${locked}"><span class="mini-symbol" data-symbol="${type}:rep"></span><span class="recruit-name">${name}<b>${values}</b></span><span class="recruit-turns">${turns}</span><span class="recruit-cost">${cost}</span></div>`;
const body = `
<section class="pane-section">
  <div class="menu-head"><h4>Resources <span class="new-tag">new</span></h4><span class="selection-count">Turn 1 income in brackets</span></div>
  <div class="res-bar" style="margin-top:0.35rem">
    <div class="res-cell"><div class="res-label">Funds</div><div class="res-value">34<span class="res-delta">(+12)</span></div></div>
    <div class="res-cell"><div class="res-label">Manpower</div><div class="res-value">6,500<span class="res-delta">(+1,200)</span></div></div>
    <div class="res-cell" data-optional="true" title="Optional resource: may be cut"><div class="res-label">Materiel<span class="res-optional">optional</span></div><div class="res-value">8<span class="res-delta">(+3)</span></div></div>
  </div>
  <p class="aid">Funds income includes <b>+4 Funds (Soviet aid)</b></p>
</section>
<section class="pane-section" style="padding-top:0.55rem">
  <h3>Madrid</h3>
  <p class="pane-meta" style="margin-top:0.1rem">Held by Republican Government &middot; capital, recruits here</p>
  <div class="order-tabs"><span>Move</span><span>Entrench</span><span>Rest</span><span data-on="true">Recruit</span><span>Replenish</span></div>
  <div class="recruit-menu">
    ${row("militia", "Militia column", "3-4", "3 Funds, 1,000 men &middot; Madrid", "next turn", true, false)}
    ${row("infantry", "Infantry regiment", "4-6", "6 Funds, 1,500 men &middot; Madrid", "2 turns", false, false)}
    ${row("artillery", "Artillery", "4-2", "8 Funds, 600 men, 3 Materiel &middot; Madrid", "3 turns", false, false)}
    ${row("tank", "Tank", "5-3", "12 Funds, 300 men, 5 Materiel &middot; needs a Workshop", "4 turns", false, true)}
  </div>
  <div class="army-card">
    <div class="formation-name">Wad-Ras Infantry Regiment No. 1</div>
    <div class="formation-meta">Infantry regiment &middot; Madrid</div>
    <div class="army-line" style="--strength-share:0.764"><span class="army-line-values"><strong>3-5</strong><s>4-6</s></span><span class="army-line-strength"><span class="army-line-bar"></span>420/550 men</span></div>
    <div class="replenish"><span><b>Replenish</b> 130 men for 2 Funds &middot; back to 4-6 next turn</span><button type="button">Replenish</button></div>
  </div>
</section>`;
document.getElementById("pane").innerHTML = pane({ body });
document.getElementById("mark").innerHTML = mark("top:28px;right:120px");
</script>
</body>
</html>
