<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1440x800">
<meta name="mock-out" content="1200">
<title>rail-lane</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .overlay { position: absolute; left: 0; top: 0; z-index: 3; }
  .rail-halo { fill: none; stroke: rgb(251 246 234 / 85%); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .rail-line { fill: none; stroke: #241d18; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .rail-ties { fill: none; stroke: #241d18; stroke-width: 9; stroke-dasharray: 1.6 7; stroke-linejoin: round; }
  .rail-move-casing { fill: none; stroke: #1f3550; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .rail-move-core { fill: none; stroke: #fbf6ea; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .cap { position: absolute; z-index: 6; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); font: 800 11.5px var(--sans); white-space: nowrap; box-shadow: 0 1px 3px rgb(0 0 0 / 35%); }
  .cap svg { width: 18px; height: 14px; }
  .cap[data-full="near"] { background: var(--gold-wash); border-color: #7a5a06; }
  .cap small { color: var(--ink-soft); font-weight: 650; font-size: 10.5px; }
  .key { position: absolute; left: 600px; top: 674px; z-index: 6; display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.55rem; align-items: center; width: 370px; padding: 0.5rem 0.7rem; border: 1px solid rgb(36 29 24 / 30%); border-radius: 8px; background: rgb(251 246 234 / 94%); box-shadow: 0 4px 14px rgb(20 14 10 / 25%); font-size: 0.78rem; }
  .key svg { width: 54px; height: 14px; }
  .rail-order { display: grid; grid-template-columns: auto 1fr; column-gap: 0.65rem; align-items: center; padding: 0.45rem 0.65rem; border: 1px solid #7a5a06; border-radius: 6px; background: var(--gold-wash); }
  .rail-order b { font-family: var(--serif); font-size: 1.02rem; }
  .rail-order span { grid-column: 2; color: var(--ink-soft); font-size: 0.8rem; }
  .rail-icon { grid-row: span 2; width: 1.8rem; height: 1rem; }
  .cap-meter { display: flex; gap: 4px; margin-top: 0.35rem; }
  .cap-meter i { flex: 1; height: 10px; border: 1.5px solid var(--ink); border-radius: 2px; }
  .cap-meter i[data-on="true"] { background: #1f3550; }
</style>
</head>
<body>
<div class="stage" style="width:1440px;height:800px">
  <img class="base" src="base/operational.webp" alt="">
  <svg class="overlay" width="1440" height="800" viewBox="0 0 1440 800">
    <defs>
      <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3550" stroke="#fbf6ea" stroke-width="1"/></marker>
      <!-- Madrid - Aranjuez - Alcazar - Albacete - Xativa - Valencia -->
      <path id="mv" d="M418,303 L432,340 L470,392 L540,430 L594,459 L640,452 L668,428 L690,403"/>
      <!-- Badajoz - Merida - Zafra - Sevilla -->
      <path id="sv" d="M128,463 L171,470 L176,520 L190,575 L205,630"/>
    </defs>
    <use href="#mv" class="rail-halo"/><use href="#mv" class="rail-ties"/><use href="#mv" class="rail-line"/>
    <use href="#sv" class="rail-halo"/><use href="#sv" class="rail-ties" style="stroke:#3d2f55"/><use href="#sv" class="rail-line" style="stroke:#3d2f55"/>
    <!-- planned rail move: Valencia to Madrid, the two Valencia regiments -->
    <path d="M680,390 L658,414 L634,438 L594,446 L548,420 L482,382 L446,334 L432,318" class="rail-move-casing" marker-end="url(#head)"/>
    <path d="M680,390 L658,414 L634,438 L594,446 L548,420 L482,382 L446,334 L434,320" class="rail-move-core"/>
    <g>
      <circle cx="520" cy="404" r="10" fill="#241d18" stroke="#fbf6ea" stroke-width="1.5"/>
      <text x="520" y="408" fill="#fbf6ea" font-family="Inter, system-ui" font-size="10.5" font-weight="800" text-anchor="middle">x2</text>
    </g>
    <circle cx="171" cy="470" r="4.2" fill="#665089" stroke="#241d18" stroke-width="1.3"/>
    <text x="180" y="462" fill="#241d18" font-family="Inter, system-ui" font-size="12.5" font-weight="650" paint-order="stroke" stroke="rgb(251 246 234 / 92%)" stroke-width="3.5" stroke-linejoin="round">M&eacute;rida</text>
  </svg>
  <div class="cap" data-full="near" style="left:470px;top:466px"><svg viewBox="0 0 36 28" fill="none" stroke="#241d18" stroke-width="2.4"><path d="M10 2L5 26M26 2l5 24"/><path d="M8 8h20M7 14.5h22M6 21h24" stroke-width="3"/></svg>Rail 2/3 armies <small>this turn</small></div>
  <div class="cap" style="left:196px;top:540px;border-color:#3d2f55"><svg viewBox="0 0 36 28" fill="none" stroke="#3d2f55" stroke-width="2.4"><path d="M10 2L5 26M26 2l5 24"/><path d="M8 8h20M7 14.5h22M6 21h24" stroke-width="3"/></svg>SIC rail 0/2 <small>Sevilla - M&eacute;rida - Badajoz</small></div>
  <div class="counter-layer" data-level="operational" id="counters" style="z-index:5"></div>
  <div class="key">
    <svg viewBox="0 0 54 14"><path d="M2,7 H52" stroke="rgb(251 246 234 / 85%)" stroke-width="9"/><path d="M2,7 H52" stroke="#241d18" stroke-width="9" stroke-dasharray="1.6 7"/><path d="M2,7 H52" stroke="#241d18" stroke-width="2.4"/></svg><span>Rail line (ties); purple ties: enemy-held</span>
    <svg viewBox="0 0 54 14"><path d="M4,7 H44" stroke="#1f3550" stroke-width="9" stroke-linecap="round"/><path d="M4,7 H44" stroke="#fbf6ea" stroke-width="3.2" stroke-linecap="round"/><path d="M44,1 L53,7 L44,13z" fill="#1f3550"/></svg><span><b>Rail move</b>: cased line, any distance along own track</span>
    <svg viewBox="0 0 54 14"><path d="M4,7 H44" stroke="#1f3550" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M44,1 L53,7 L44,13z" fill="#1f3550"/></svg><span><b>Road move</b>: dashed, one territory (today)</span>
  </div>
  <div id="pane"></div>
  <div id="mark"></div>
</div>
<script>
document.getElementById("counters").innerHTML = counter({ f: "rep", type: "infantry", des: "O9", x: 634, y: 411, w: 52, h: 40, selected: true, ordered: true }) + counter({ f: "rep", type: "infantry", des: "G10", x: 692, y: 411, w: 52, h: 40, selected: true, ordered: true });
const rail = '<svg class="rail-icon" viewBox="0 0 54 14"><path d="M4,7 H44" stroke="#1f3550" stroke-width="9" stroke-linecap="round"/><path d="M4,7 H44" stroke="#fbf6ea" stroke-width="3.2" stroke-linecap="round"/><path d="M44,1 L53,7 L44,13z" fill="#1f3550"/></svg>';
const body = `
<section class="pane-section" style="padding-top:0">
  <h3>Valencia</h3>
  <p class="pane-meta" style="margin-top:0.1rem">Held by Republican Government &middot; rail station at Valencia</p>
  <div class="army-picker"><div class="army-picker-header"><h4>Your armies</h4><span class="selection-count">2 of 2 selected</span></div>
  <ul class="formation-list">
    <li><div class="formation-button" aria-pressed="true" style="--strength-share:1"><span class="formation-check"></span><span><span class="formation-name" style="display:block;font-weight:700">Otumba Infantry Regiment No. 9</span><span class="formation-meta">Infantry regiment &middot; Moving by rail</span></span></div></li>
    <li><div class="formation-button" aria-pressed="true" style="--strength-share:1"><span class="formation-check"></span><span><span class="formation-name" style="display:block;font-weight:700">Guadalajara Infantry Regiment No. 10</span><span class="formation-meta">Infantry regiment &middot; Moving by rail</span></span></div></li>
  </ul></div>
</section>
<section class="pane-section">
  <h4 style="margin-top:0">Order <span class="new-tag">new</span></h4>
  <div class="rail-order" style="margin-top:0.35rem">${rail}<b>Move by rail</b><span>Valencia &rarr; Madrid along the Albacete line. Arrives this turn; cannot attack on arrival.</span></div>
  <h4>Madrid - Valencia line</h4>
  <div class="cap-meter"><i data-on="true"></i><i data-on="true"></i><i></i></div>
  <p class="pane-meta">2 of 3 armies this turn. A Rail depot in Madrid would raise it to 4.</p>
  <p class="pane-note">Enemy armies in a territory on the line cut it beyond that point.</p>
</section>`;
document.getElementById("pane").innerHTML = pane({ body });
document.getElementById("mark").innerHTML = mark("top:28px;right:120px");
</script>
</body>
</html>
