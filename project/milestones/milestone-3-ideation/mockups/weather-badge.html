<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1440x800">
<meta name="mock-out" content="1200">
<title>weather-badge</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .kicker-cover { position: absolute; left: 14px; top: 6px; width: 380px; height: 22px; background: var(--canvas); z-index: 2; }
  .kicker { position: absolute; left: 20px; top: 10px; z-index: 3; }
  .wx-badge { position: absolute; z-index: 4; display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.22rem 0.75rem 0.22rem 0.35rem; border: 1.5px solid #2e5f87; border-radius: 999px; color: #1f3550; background: #e7eef4; font-size: 0.84rem; font-weight: 800; white-space: nowrap; }
  .wx-badge svg { width: 20px; height: 20px; }
  .zone { position: absolute; z-index: 4; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 3px; border: 1.5px solid var(--ink); border-radius: 999px; background: rgb(251 246 234 / 94%); font: 800 11.5px var(--sans); white-space: nowrap; box-shadow: 0 1px 3px rgb(0 0 0 / 35%); }
  .zone svg { width: 18px; height: 18px; }
  .zone small { color: var(--ink-soft); font-weight: 650; }
  .wx-table { width: 100%; margin-top: 0.4rem; border-collapse: collapse; font-size: 0.8rem; }
  .wx-table th { padding: 0.2rem 0; color: var(--ink-soft); font-size: 0.66rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; text-align: left; }
  .wx-table td { padding: 0.3rem 0.2rem 0.3rem 0; border-top: 1px dotted rgb(36 29 24 / 22%); vertical-align: top; }
  .wx-table td:first-child { font-weight: 700; white-space: nowrap; }
  .wx-cond { display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 700; white-space: nowrap; }
  .wx-cond svg { width: 16px; height: 16px; }
  .eff { color: var(--ink-soft); font-size: 0.76rem; }
  .eff b { color: var(--accent); }
  .odds-row { display: grid; grid-template-columns: 6.5rem 1fr; gap: 0.5rem; align-items: center; margin-top: 0.3rem; font-size: 0.76rem; }
  .odds-bar { display: flex; height: 12px; border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; font-size: 0; }
</style>
</head>
<body>
<div class="stage" style="width:1440px;height:800px">
  <img class="base" src="base/planning.webp" alt="">
  <svg class="abs" style="left:0;top:0;z-index:1" width="1440" height="800">
    <defs>
      <pattern id="snow" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff"/><circle cx="6.5" cy="6" r="0.8" fill="#fff"/></pattern>
      <radialGradient id="fade"><stop offset="0.55" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <mask id="meseta"><ellipse cx="430" cy="300" rx="190" ry="150" fill="url(#fade)"/></mask>
    </defs>
    <g mask="url(#meseta)"><rect x="200" y="140" width="460" height="330" fill="#f4f7fa" opacity="0.28"/><rect x="200" y="140" width="460" height="330" fill="url(#snow)" opacity="0.9"/></g>
  </svg>
  <div class="kicker-cover"></div>
  <div class="kicker screen-kicker">Turn 11 &middot; 18&ndash;31 December 1936 &middot; Planning</div>
  <div class="wx-badge" style="left:1046px;top:22px" id="badge"></div>
  <div class="counter-layer" data-level="overview" id="counters" style="z-index:3"></div>
  <div id="zones"></div>
  <div id="pane"></div>
  <div id="mark"></div>
</div>
<script>
const ICON = {
  snow: '<svg viewBox="0 0 20 20" fill="none" stroke="#2e5f87" stroke-width="1.6" stroke-linecap="round"><path d="M10 2v16M3 6l14 8M3 14l14-8"/><path d="M8 3.5l2 1.5 2-1.5M8 16.5l2-1.5 2 1.5"/></svg>',
  rain: '<svg viewBox="0 0 20 20" fill="none" stroke="#1f3550" stroke-width="1.6" stroke-linecap="round"><path d="M5 11a4 4 0 0 1 .5-8 5 5 0 0 1 9.3 1.6A3.2 3.2 0 0 1 15 11z" fill="#d7dee4"/><path d="M6 14l-1 3M10 14l-1 3M14 14l-1 3"/></svg>',
  clear: '<svg viewBox="0 0 20 20" fill="none" stroke="#a87708" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.6" fill="#f2c84b"/><path d="M10 1.5v2.5M10 16v2.5M1.5 10H4M16 10h2.5M4 4l1.8 1.8M14.2 14.2 16 16M16 4l-1.8 1.8M5.8 14.2 4 16"/></svg>'
};
document.getElementById("badge").innerHTML = `${ICON.snow}Snow on the Meseta`;
const zone = (icon, name, cond, x, y) => `<div class="zone" style="left:${x}px;top:${y}px">${ICON[icon]}${cond} <small>${name}</small></div>`;
document.getElementById("zones").innerHTML = [
  zone("snow", "Meseta", "Snow", 470, 232),
  zone("rain", "Cantabrian", "Rain", 218, 92),
  zone("clear", "Mediterranean", "Clear", 700, 460),
  zone("rain", "Andaluc\u00eda", "Rain", 440, 612)
].join("");
const cond = (icon, text) => `<span class="wx-cond">${ICON[icon]}${text}</span>`;
const bar = (s, r, c) => `<div class="odds-bar"><i style="width:${s}%;background:#9fb9cf"></i><i style="width:${r}%;background:#5d7389"></i><i style="width:${c}%;background:#f2c84b"></i></div>`;
const body = `
<section class="pane-section" style="padding-top:0">
  <h3>Weather this turn <span class="new-tag">new</span></h3>
  <p class="pane-meta" style="margin-top:0.1rem">Rolled once per zone at the start of each two-week turn. Odds change with the month.</p>
  <table class="wx-table">
    <tr><th>Zone</th><th>Now</th><th>Effect</th></tr>
    <tr><td>Meseta</td><td>${cond("snow", "Snow")}</td><td class="eff"><b>&minus;2 attack roll</b>; road moves 1 territory, rail only beyond; aircraft grounded</td></tr>
    <tr><td>Cantabrian</td><td>${cond("rain", "Rain")}</td><td class="eff"><b>&minus;1 attack roll</b>; aircraft grounded</td></tr>
    <tr><td>Mediterranean</td><td>${cond("clear", "Clear")}</td><td class="eff">No effect</td></tr>
    <tr><td>Andaluc&iacute;a</td><td>${cond("rain", "Rain")}</td><td class="eff"><b>&minus;1 attack roll</b>; aircraft grounded</td></tr>
  </table>
</section>
<section class="pane-section">
  <h4 style="margin-top:0;display:flex;justify-content:space-between">Odds for late December <span class="selection-count">snow &middot; rain &middot; clear</span></h4>
  <div class="odds-row"><span>Meseta</span>${bar(45, 30, 25)}</div>
  <div class="odds-row"><span>Cantabrian</span>${bar(15, 60, 25)}</div>
  <div class="odds-row"><span>Mediterranean</span>${bar(0, 30, 70)}</div>
  <div class="odds-row"><span>Andaluc&iacute;a</span>${bar(0, 40, 60)}</div>
  <p class="hatch-note" style="margin-top:0.5rem">Illustrative odds, not tuned. In July the Meseta is 90 percent clear.</p>
</section>
<section class="pane-section">
  <h4 style="margin-top:0">Your orders this turn</h4>
  <p class="pane-note">Wad-Ras No. 1 and 3 more armies march through the Meseta: snow stops them after one territory, and their attack on Castilla-La Mancha rolls at &minus;2.</p>
</section>`;
document.getElementById("counters").innerHTML = counter({ f: "nic", type: "infantry", values: "15-22", count: 4, x: 363, y: 252, w: 50, h: 26 }) + counter({ f: "rep", type: "infantry", values: "14-21", count: 4, x: 417, y: 363, w: 50, h: 26, ordered: false, style: "border-style:dashed" });
document.getElementById("pane").innerHTML = pane({ body });
document.getElementById("mark").innerHTML = mark("left:130px;bottom:28px");
</script>
</body>
</html>
